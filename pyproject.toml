[project]
name = "academic-rag-qa"
version = "1.0.0"
description = "Academic question answering over study PDFs using Retrieval-Augmented Generation."
requires-python = ">=3.11"

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.per-file-ignores]
# long lines are prose: sample notes and LLM-judge prompt text
"scripts/make_samples.py" = ["E501"]
"evaluation/metrics.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
